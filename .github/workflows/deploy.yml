# Builds the site with fresh timetable data and publishes it to GitHub Pages:
# every morning at 04:30 Israel time (01:30 UTC), on every push to main, and on demand.
name: Build and deploy the site

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # downloads the Ministry of Transport GTFS (~180 MB) and builds Gush Dan for today and the next two days
      - name: Build data and page
        run: scripts/build_site.sh
      - name: Tests
        run: |
          node tests/engine_test.mjs
          node tests/routing_test.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
